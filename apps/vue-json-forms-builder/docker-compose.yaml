services:
    postgres:
        image: postgres:18
        environment:
            POSTGRES_USER: form_builder
            POSTGRES_PASSWORD: form_builder
            POSTGRES_DB: form_builder
            POSTGRES_TEST_DB: form_builder_test
            PGDATA: /var/lib/postgresql/data
        ports:
            - "5433:5432"
        # TODO: remove volumes since database data should be initialized via scripts (e.g use typescript orm and a typescript script to set the data) and should not rely on manually created data
        volumes:
            - ./data/pgdata:/var/lib/postgresql/data
            #  manual: docker compose exec postgres createdb -U form_builder form_builder_test
            - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U form_builder"]
            interval: 5s
            timeout: 5s
            retries: 10

    keycloak:
        image: quay.io/keycloak/keycloak:26.6.1
        environment:
            KC_BOOTSTRAP_ADMIN_USERNAME: admin
            KC_BOOTSTRAP_ADMIN_PASSWORD: admin
            KC_HOSTNAME: http://kc1.localhost:8080
            KC_HTTP_ENABLED: true
        ports:
            - "8080:8080"
        # TODO: remove volumes since all configuration should be done reproducibly via configuration (Realm Export)
        volumes:
            #      - ./data/keycloak:/opt/keycloak/data
            - ./keycloak/dev:/opt/keycloak/data/import:ro
        command:
            - "start-dev"
            - "--import-realm"
        # Alias so OTHER containers (app, collab) can reach kc1 at its
        # canonical KC_HOSTNAME (kc1.localhost:8080) — containers cannot
        # resolve *.localhost on their own.
        networks:
            default:
                aliases:
                    - kc1.localhost

    external-keycloak:
        image: quay.io/keycloak/keycloak:26.6.1
        environment:
            KC_BOOTSTRAP_ADMIN_USERNAME: admin
            KC_BOOTSTRAP_ADMIN_PASSWORD: admin
            KC_HOSTNAME: http://external-keycloak.localhost:8081
            KC_HTTP_ENABLED: true
            # Listen on 8081 inside the container too, so kc1 can reach the
            # broker endpoints at external-keycloak.localhost:8081 (the IdP config in keycloak/dev/dev-realm.json uses :8081 for token/userinfo/introspection URLs).
            # A "8081:8080" publish would only work from the host, not container-to-container.
            KC_HTTP_PORT: 8081
        ports:
            - "8081:8081"
        volumes:
            - ./keycloak/external:/opt/keycloak/data/import:ro
        command:
            - "start-dev"
            - "--import-realm"
        networks:
            default:
                aliases:
                    - external-keycloak.localhost

    # Containerized instance of the app itself, used in CI (and optionally locally) to run integration/e2e tests against a real, built server
    # instead of `yarn dev:internal`. Gated behind the `ci` profile so a plain `docker compose up` (local dev: just postgres + keycloak) never
    # builds/starts it -- use `docker compose --profile ci up -d --build`.
    #
    # Connects to the SAME Postgres/Keycloak instances above, but against the separate `form_builder_test` database
    app:
        profiles: ["ci"]
        build:
            context: ../..
            dockerfile: Dockerfile
            target: run-form-builder
        env_file:
            - .env.docker.backend
        ports:
            - "3000:3000"
        depends_on:
            postgres:
                condition: service_healthy
            keycloak:
                condition: service_started

    collab:
        profiles: ["ci"]
        build:
            context: ../..
            dockerfile: Dockerfile
            target: run-collab-server
        env_file:
            - .env.docker.collab
        environment:
            COLLAB_NUXT_URL: http://app:3000
            COLLAB_PORT: "1234"
        ports:
            - "1234:1234"
        depends_on:
            postgres:
                condition: service_healthy
            app:
                condition: service_healthy

    external-example-app:
        profiles: ["ci"]
        build:
            context: ../..
            dockerfile: Dockerfile
            target: run-external-demo
        env_file:
            - .env.docker.external
        ports:
            - "3001:3000"
        depends_on:
            external-keycloak:
                condition: service_started
