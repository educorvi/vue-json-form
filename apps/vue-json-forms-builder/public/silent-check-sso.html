<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Silent check-sso</title>
</head>
<body>
    <!--
        Silent check-sso page for the keycloak-js adapter
        (packages/vue-json-forms-builder, useBuilderAuth.ts).

        keycloak-js loads this page in a hidden IFRAME during the silent
        `check-sso` (onLoad: 'check-sso' + silentCheckSsoRedirectUri). Its
        only job is to relay the received tokens/URL to the embedding page
        via postMessage. It must be served by the HOSTING page's origin and
        be listed in the public Keycloak client's "Valid redirect URIs".

        Ship it into the host app's public directory — the URL defaults to
        `<origin>/silent-check-sso.html` (override via the
        `silentCheckSsoRedirectUri` config option / `kc-silent-check-sso-uri`
        webcomponent attribute).
    -->
    <script>
        parent.postMessage(location.href, location.origin);
    </script>
</body>
</html>
