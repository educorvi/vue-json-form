services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: form_builder
      POSTGRES_PASSWORD: form_builder
      POSTGRES_DB: form_builder
      POSTGRES_TEST_DB: form_builder_test
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5433:5432"
    volumes:
      - fb-staging-pgdata:/var/lib/postgresql/data
      - ../docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U form_builder"]
      interval: 5s
      timeout: 5s
      retries: 10

  fb-auth:
    image: quay.io/keycloak/keycloak:26.6.1
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://fb-auth.gpu-test.educorvi.com:8080
      KC_HTTP_ENABLED: true
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    command:
      - "start-dev"
      - "--import-realm"
    networks:
      default:
        aliases:
          - fb-auth.gpu-test.educorvi.com

  fb-auth-external:
    image: quay.io/keycloak/keycloak:26.6.1
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://fb-auth-external.gpu-test.educorvi.com:8081
      KC_HTTP_ENABLED: true
      KC_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    command:
      - "start-dev"
      - "--import-realm"
    networks:
      default:
        aliases:
          - fb-auth-external.gpu-test.educorvi.com
  fb:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: run-form-builder
    env_file:
      - .env.backend
    ports:
      - "3100:3000"
    depends_on:
      postgres:
        condition: service_healthy
      fb-auth:
        condition: service_started
    networks:
      default:
        aliases:
          - fb.gpu-test.educorvi.com

  fb-collab:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: run-collab-server
    env_file:
      - .env.collab
    environment:
      COLLAB_NUXT_URL: http://fb:3000
      COLLAB_PORT: "1234"
    ports:
      - "1234:1234"
    depends_on:
      postgres:
        condition: service_healthy
      fb:
        condition: service_healthy
    networks:
      default:
        aliases:
          - fb-collab.gpu-test.educorvi.com

  # External demo app (apps/json-forms-webcomponent-example-external): mounts
  # the form-builder webcomponent, logs in via keycloak-js against fb-auth
  # (PUBLIC client vueformbuilder-embed, kc_idp_hint brokers fb-auth-external)
  # and loads forms over the collab websocket. All NUXT_PUBLIC_* values are
  # RUNTIME vars (see .env.external) — no build args, prebuilt image works.
  fb-external:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: run-external-demo
    env_file:
      - .env.external
    ports:
      - "3001:3000"
    depends_on:
      fb-auth:
        condition: service_started
      fb:
        condition: service_healthy
    networks:
      default:
        aliases:
          - fb-external.gpu-test.educorvi.com

volumes:
  fb-staging-pgdata:
