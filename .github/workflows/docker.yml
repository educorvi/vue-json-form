name: docker.yml
on:
    push:
        branches:
            - feat/vue-json-forms-builder

permissions:
    contents: read
    packages: write

jobs:
    docker:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Compute short commit SHA
              id: sha
              run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

            - name: Build and push Form Builder image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile
                  target: run-form-builder
                  push: true
                  tags: |
                      ghcr.io/educorvi/vue-json-form/vue-json-forms-builder:sha-${{ steps.sha.outputs.short }}
                      ghcr.io/educorvi/vue-json-form/vue-json-forms-builder:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Build and push Collab Server image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile
                  target: run-collab-server
                  push: true
                  tags: |
                      ghcr.io/educorvi/vue-json-form/vue-json-forms-builder-collab-server:sha-${{ steps.sha.outputs.short }}
                      ghcr.io/educorvi/vue-json-form/vue-json-forms-builder-collab-server:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
