name: Form Builder Tests

on:
    push:
        branches:
            - '**'
    pull_request:
        branches:
            - 'main'
            - 'release/*'
    merge_group:
        types:
            - checks_requested
    workflow_dispatch:

concurrency:
    group: form-builder-tests-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    FORM_BUILDER_FILTERS: >-
        --filter=@educorvi/vue-json-forms-builder
        --filter=@educorvi/vue-json-forms-builder-webcomponent
        --filter=vue-json-forms-builder
        --filter=vue-json-forms-builder-external-example
        --filter=vue-json-forms-builder-collab-server

jobs:
    mocked:
        name: Mocked unit/component (no backend)
        runs-on: ubuntu-latest
        permissions:
            contents: read
            checks: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v6
              with:
                  node-version: lts/*
                  cache: yarn
            - run: yarn install --immutable
            # No `--affected` here: this tier is meant to run on every commit
            # to the form-builder packages (see `#0 packages` skips otherwise).
            - run: npx turbo run build:internal ${{ env.FORM_BUILDER_FILTERS }}
            - run: npx turbo run test:unit ${{ env.FORM_BUILDER_FILTERS }}
            - name: Install Playwright Chromium
              run: yarn playwright install --with-deps chromium
              working-directory: packages/vue-json-forms-builder-webcomponent
            - name: Webcomponent mocked browser tests (self-hosted, no backend)
              run: npx turbo run test:e2e --filter=@educorvi/vue-json-forms-builder-webcomponent

            # ── Reports ─────────────────────────────────────────────────────
            - name: Upload JUnit results
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: mocked-junit
                  path: |
                      packages/*/test-results/**/*.xml
                      apps/*/test-results/**/*.xml
                  if-no-files-found: ignore
            - name: Upload webcomponent Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: mocked-webcomponent-playwright
                  path: |
                      packages/vue-json-forms-builder-webcomponent/playwright-report/
                      packages/vue-json-forms-builder-webcomponent/test-results/
                  if-no-files-found: ignore
            - name: Publish test results
              if: ${{ !cancelled() }}
              continue-on-error: true
              uses: EnricoMi/publish-unit-test-result-action@v2
              with:
                  check_name: Mocked test results
                  files: |
                      packages/*/test-results/**/*.xml
                      apps/*/test-results/**/*.xml

    stack-e2e:
        name: Backend-gated integration/e2e (docker-compose ci profile)
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
            checks: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v6
              with:
                  node-version: lts/*
                  cache: yarn
            - run: yarn install --immutable

            - name: Determine whether the affected set needs the real stack
              id: affected
              run: |
                  COUNT=$(npx turbo run test:integration test:e2e --affected ${{ env.FORM_BUILDER_FILTERS }} --dry=json \
                    | jq '[.tasks[]] | length')
                  echo "count=$COUNT" >> "$GITHUB_OUTPUT"
                  echo "Affected test:integration/test:e2e tasks: $COUNT"

            - name: Build the affected packages/apps
              if: steps.affected.outputs.count != '0'
              run: npx turbo run build:internal --affected ${{ env.FORM_BUILDER_FILTERS }}

            - name: Start the docker-compose ci profile stack
              if: steps.affected.outputs.count != '0'
              working-directory: apps/vue-json-forms-builder
              run: docker compose -p formbuilder-e2e-${{ github.run_id }} --profile ci up -d --build --wait

            - name: Install Playwright browsers
              if: steps.affected.outputs.count != '0'
              run: yarn playwright install --with-deps chromium

            - name: Run integration + e2e tests against the real stack
              if: steps.affected.outputs.count != '0'
              env:
                  PLAYWRIGHT_BASE_URL: http://localhost:3000
                  NUXT_TEST_BASE_URL: http://localhost:3000
              run: >-
                  npx turbo run test:integration test:e2e --affected
                  --filter=vue-json-forms-builder
                  --filter=vue-json-forms-builder-external-example

            - name: Webcomponent e2e against the real stack (backend-gated spec only)
              if: steps.affected.outputs.count != '0'
              env:
                  E2E_BACKEND_URL: http://localhost:3000
              run: yarn playwright test -g webcomponent-collab
              working-directory: packages/vue-json-forms-builder-webcomponent

            # ── Logs & reports ──────────────────────────────────────────────
            - name: Collect docker-compose logs
              if: always() && steps.affected.outputs.count != '0'
              working-directory: apps/vue-json-forms-builder
              run: |
                  mkdir -p "$GITHUB_WORKSPACE/stack-logs"
                  P="formbuilder-e2e-${{ github.run_id }}"
                  docker compose -p "$P" --profile ci ps -a \
                      > "$GITHUB_WORKSPACE/stack-logs/_containers.txt" 2>&1 || true
                  for svc in postgres keycloak external-keycloak app collab external-example-app; do
                      docker compose -p "$P" --profile ci logs --no-color --timestamps "$svc" \
                          > "$GITHUB_WORKSPACE/stack-logs/$svc.log" 2>&1 || true
                  done

            - name: Upload docker-compose logs
              if: always() && steps.affected.outputs.count != '0'
              uses: actions/upload-artifact@v4
              with:
                  name: stack-e2e-docker-logs
                  path: stack-logs/
                  if-no-files-found: ignore

            - name: Upload Playwright reports
              if: always() && steps.affected.outputs.count != '0'
              uses: actions/upload-artifact@v4
              with:
                  name: stack-e2e-playwright
                  path: |
                      apps/vue-json-forms-builder/playwright-report/
                      apps/vue-json-forms-builder/test-results/
                      apps/vue-json-forms-builder-external-example/playwright-report/
                      apps/vue-json-forms-builder-external-example/test-results/
                      packages/vue-json-forms-builder-webcomponent/playwright-report/
                      packages/vue-json-forms-builder-webcomponent/test-results/
                  if-no-files-found: ignore

            - name: Publish e2e test results
              if: always() && steps.affected.outputs.count != '0'
              continue-on-error: true
              uses: EnricoMi/publish-unit-test-result-action@v2
              with:
                  check_name: Stack e2e test results
                  files: |
                      apps/*/test-results/**/*.xml
                      packages/*/test-results/**/*.xml

            - name: Tear down the docker-compose ci profile stack
              if: always() && steps.affected.outputs.count != '0'
              working-directory: apps/vue-json-forms-builder
              run: docker compose -p formbuilder-e2e-${{ github.run_id }} --profile ci down -v

    docker:
        name: Build & push Form Builder images
        needs: [mocked, stack-e2e]
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/vue-json-forms-builder'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Compute short commit SHA
              id: sha
              run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

            - name: Build and push Form Builder image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile
                  target: run-form-builder
                  push: true
                  tags: |
                      ghcr.io/educorvi/vue-json-form/vue-json-forms-builder:sha-${{ steps.sha.outputs.short }}
                      ghcr.io/educorvi/vue-json-form/vue-json-forms-builder:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Build and push Collab Server image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile
                  target: run-collab-server
                  push: true
                  tags: |
                      ghcr.io/educorvi/vue-json-form/vue-json-forms-builder-collab-server:sha-${{ steps.sha.outputs.short }}
                      ghcr.io/educorvi/vue-json-form/vue-json-forms-builder-collab-server:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
